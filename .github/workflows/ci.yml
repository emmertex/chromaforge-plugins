# Runs on every pull request and push: the tool's tests, then every record checked against its
# repository's newest release. No secrets, read-only token: safe for pull requests from forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Tool tests
        run: python -m unittest discover -s tests -v
      - name: The published index (ids keep their record)
        run: |
          mkdir -p _prev
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/index/index.json" -o _prev/index.json || rm -f _prev/index.json
      - name: Check every record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          python tools/market.py check --previous _prev/index.json --report report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
